name = "filetmp-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# Trang tĩnh (public/) + API (/api/*) trên cùng một domain
routes = [{ pattern = "txt.no.id.vn", custom_domain = true }]

[assets]
directory = "../public"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "NOTES"
id = "5e91a66146f3448f8a7ea7533b503a79"

[vars]
# Comma-separated; "*" = any origin
ALLOWED_ORIGINS = "https://txt.no.id.vn"
